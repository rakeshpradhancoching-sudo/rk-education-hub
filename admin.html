<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwayamStore - Master Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --secondary: #ef4444; --bg: #f8fafc; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        
        /* Login Overlay */
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 85%; max-width: 350px; text-align: center; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* Main Layout */
        .container { max-width: 500px; margin: 0 auto; padding-bottom: 40px; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        
        /* Camera UI */
        .camera-ui { width: 100%; height: 200px; border: 2px dashed #cbd5e1; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; background: #f1f5f9; cursor: pointer; margin-bottom: 20px; overflow: hidden; }
        #preview { width: 100%; height: 100%; object-fit: cover; display: none; position: absolute; }
        .cam-input { position: absolute; opacity: 0; width: 100%; height: 100%; z-index: 5; cursor: pointer; }

        /* Form Fields */
        .field { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; font-family: inherit; font-size: 14px; outline: none; }
        input:focus { border-color: var(--primary); }
        
        .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-main:active { transform: scale(0.97); }

        .section-title { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 10px; border-bottom: 1px solid #f1f5f9; padding-bottom: 5px; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-card">
            <h2 style="margin:0;">SwayamStore</h2>
            <p style="color:#64748b; font-size:14px; margin-bottom:20px;">Employee Dashboard</p>
            <input type="text" id="agentId" placeholder="Agent ID" style="margin-bottom:10px;">
            <input type="password" id="pin" placeholder="Enter PIN (1234)" style="margin-bottom:20px;">
            <button class="btn-main" onclick="checkLogin()">Login</button>
        </div>
    </div>

    <div class="container">
        <h2 style="font-size: 20px; color: #1e293b;">🚀 Add New Item</h2>
        
        <div class="card">
            <div class="camera-ui">
                <img id="preview" src="#">
                <div id="placeholder" style="text-align:center;">
                    <span style="font-size: 40px;">📸</span>
                    <p style="margin:5px; font-size:12px; color:#64748b;">Tap to Capture Product</p>
                </div>
                <input type="file" accept="image/*" capture="environment" class="cam-input" onchange="imgPreview(this)">
            </div>

            <div class="section-title">Shop Details</div>
            <div class="field">
                <label>Dukan ka Naam</label>
                <input type="text" id="shopName" placeholder="e.g. RK Kirana Store">
            </div>
            <div class="field">
                <label>Dukan ka Pata (Address)</label>
                <input type="text" id="shopAddress" placeholder="e.g. Near Bus Stand, Jharbandh">
            </div>
            <div class="field">
                <label>WhatsApp Number</label>
                <input type="number" id="shopPhone" placeholder="91XXXXXXXXXX">
            </div>
            <div class="field">
                <label>YouTube Video Link (Optional)</label>
                <input type="text" id="shopVideo" placeholder="https://youtube.com/...">
            </div>

            <div class="section-title">Product Details</div>
            <div class="field">
                <label>Product ka Naam</label>
                <input type="text" id="pName" placeholder="e.g. 5kg Rice / Saree / Mobile">
            </div>
            <div class="field">
                <label>Price (₹)</label>
                <input type="number" id="pPrice" placeholder="Selling Price">
            </div>
            <div class="field">
                <label>Short Description</label>
                <textarea id="pDesc" placeholder="Product ke baare mein thoda batayein..."></textarea>
            </div>

            <button class="btn-main" id="uploadBtn" onclick="saveData()">🚀 Make it Live</button>
            <p id="status" style="text-align:center; font-size:13px; font-weight:600; margin-top:10px;"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        // IMPORTANT: Replace with your Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSy...", 
            authDomain: "your-project.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:12345:web:abcde"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Security Check
        window.checkLogin = function() {
            const id = document.getElementById('agentId').value;
            const pin = document.getElementById('pin').value;
            if(pin === "1234" && id !== "") {
                localStorage.setItem("currentAgent", id);
                document.getElementById('loginOverlay').style.display = 'none';
            } else { alert("Wrong ID or PIN!"); }
        }

        // Preview Image
        window.imgPreview = function(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('preview').src = e.target.result;
                    document.getElementById('preview').style.display = 'block';
                    document.getElementById('placeholder').style.display = 'none';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // Save to Database
        window.saveData = async function() {
            const btn = document.getElementById('uploadBtn');
            const status = document.getElementById('status');
            
            const productData = {
                shopName: document.getElementById('shopName').value,
                shopAddress: document.getElementById('shopAddress').value,
                shopPhone: document.getElementById('shopPhone').value,
                youtube: document.getElementById('shopVideo').value,
                pName: document.getElementById('pName').value,
                pPrice: document.getElementById('pPrice').value,
                pDesc: document.getElementById('pDesc').value,
                agent: localStorage.getItem("currentAgent"),
                time: new Date().toISOString()
            };

            // Validation
            if(!productData.shopName || !productData.pName || !productData.pPrice || !productData.shopPhone) {
                alert("Please fill all required fields!");
                return;
            }

            btn.disabled = true;
            status.innerText = "⏳ Uploading to Server...";
            status.style.color = "blue";

            try {
                await addDoc(collection(db, "products"), productData);
                status.innerText = "✅ Successfully Live!";
                status.style.color = "green";
                setTimeout(() => location.reload(), 2000);
            } catch (e) {
                status.innerText = "❌ Upload Failed. Check Internet.";
                status.style.color = "red";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
